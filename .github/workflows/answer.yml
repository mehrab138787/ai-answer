name: Get AI Answer

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'سوال خود را بنویسید'
        required: true
        type: string

jobs:
  get_answer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Call OpenRouter and save answer
        run: |
          curl -s -X POST https://openrouter.ai/api/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OPENROUTER_API_KEY }}" \
            -d '{
              "model": "openrouter/free",
              "messages": [{"role": "user", "content": "'"${{ github.event.inputs.prompt }}"'"}]
            }' > full.json
          
          # استخراج پاسخ با jq و ذخیره مستقیم
          jq -r '.choices[0].message.content // "خطا"' full.json | tee answer.txt
          
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add answer.txt full.json
          git commit -m "Update answer: ${{ github.event.inputs.prompt }}" || echo "No changes"
          git push
